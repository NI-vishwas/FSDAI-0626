<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>My Card</title>
</head>
<body>
    <div class="card">
        <img src="profile.png" alt="John Doe" class="card-image">
        <h1 class="card-name">John Doe</h1>
        <p class="card-title">Lead UI/UX Designer</p>
        <p class="card-company">Design Craft Studio</p>
        <div class="card-contact">
            <p><span class="label">Email:</span> <a href="mailto:john@johndoestudios.com">john@johndoestudios.com</a></p>
            <p><span class="label">Phone:</span> <a href="tel:+11112345678">+1 (111) 234-5678</a></p>
            <p><span class="label">Web:</span> <a href="https://www.johndoestudios.com" target="_blank" rel="noopener noreferrer">www.johndoestudios.com</a></p>
        </div>
    </div>
</body>
</html>
