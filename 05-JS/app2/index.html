        const calc = function(op1,op2,op) {
            let result = 0;

            switch (op) {
                case '+':
                    result = op1 + op2;
                    return result;
                case '-':
                    result = op1 - op2;

                case '*':

                    return result;

                    return result;
                default:

            }
