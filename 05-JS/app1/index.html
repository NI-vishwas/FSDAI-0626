        const calc = function(op1,op2,op) {
            let result = 0;
            switch (op) {
                case '+':
                    result = op1 + op2;
                    return result;
                case '-':
                    result = op1 - op2;
                    return result;
                case '*':
                    result = op1 * op2;
                    return result;
                case '/':
                    result = op1 / op2;
                    return result;
                default:
                    console.log("Invalid Operator");
                    return result;
            }
        }

        let a = 100;
        let b = 100;

        console.log(calc(a,b,'+'));
        console.log(calc(a,b,'*'));
